server:
  port: 8080

spring:
  application:
    name: facility-service
  datasource:
    url: jdbc:postgresql://localhost:5432/facility
    username: facility
    password: facility
    driver-class-name: org.postgresql.Driver

facility:
  mqtt:
    broker-url: tcp://192.168.201.240:1883
    client-id: facility-svc-${random.uuid}
    username: admin
    password: admin1234
    default-api-key: 0004-2606-0801
    connection-timeout-seconds: 10
    keep-alive-interval-seconds: 60
    automatic-reconnect: true
  command:
    default-timeout-seconds: 10
  call:
    access-timeout-seconds: 30

logging:
  level:
    com.yourorg.facility: DEBUG
    org.eclipse.paho: INFO
